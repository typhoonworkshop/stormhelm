      <section class="paper-section">
        <p><cite>Typhoon</cite> is an audiovisual installation based on Joseph Conrad’s novella, in which Captain MacWhirr steers the steamer Nan-Shan directly into and through a catastrophic storm. The novella is a study of what happens when the scale of a phenomenon exceeds the practical and conceptual frameworks available to comprehend it and of the paralysis that sometimes follows a demand for action in such overwhelming circumstances. We chose the text of <cite>Typhoon</cite> to reflect on human culture’s current AI moment. We prompt a large language model, seeded with Conrad’s original language, to feed endlessly on its own output, and explore when and how the text becomes increasingly alien and unwieldy as time progresses, including deviations from the narrative, digressions into the model’s own instructions and thinking, and long periods of incoherent rumination. We employ methods from <i>activation steering</i>, including a novel <i>adaptive steering</i> method we introduce, to control the rhythm of the narrative and the model’s digressions over long stretches of generation. The simultaneous efficacy and unpredictability of this steering showcases the tension between the perceived interpretability of AI, and the reality of a system that remains outside our comprehension and control.</p>
      </section>
